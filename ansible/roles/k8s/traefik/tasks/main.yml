---
# Traefik — Ingress Controller
# k3s est configuré avec --disable=traefik ; on déploie ici la version Helm
# qui reçoit une IP LoadBalancer depuis MetalLB.

- name: Add Traefik Helm repo
  kubernetes.core.helm_repository:
    name: traefik
    repo_url: https://helm.traefik.io/traefik

- name: Create traefik namespace
  kubernetes.core.k8s:
    name: traefik
    api_version: v1
    kind: Namespace
    state: present

- name: Install Traefik Helm chart
  kubernetes.core.helm:
    name: traefik
    namespace: traefik
    chart_ref: traefik/traefik
    chart_version: "{{ traefik.helm_version }}"
    create_namespace: false
    update_repo_cache: true
    wait: true
    wait_timeout: 300
    values: "{{ lookup('template', 'values.yml.j2') | from_yaml }}"

- name: Wait for Traefik deployment to be ready
  kubernetes.core.k8s_info:
    kind: Deployment
    name: traefik
    namespace: traefik
    wait: true
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: 300

- name: Get Traefik LoadBalancer IP
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Service
    name: traefik
    namespace: traefik
  register: traefik_service
  until:
    - traefik_service.resources | length > 0
    - traefik_service.resources[0].status.loadBalancer.ingress is defined
    - traefik_service.resources[0].status.loadBalancer.ingress | length > 0
  retries: 30
  delay: 10

- name: Display Traefik LoadBalancer IP
  ansible.builtin.debug:
    msg: "Traefik LoadBalancer IP: {{ traefik_service.resources[0].status.loadBalancer.ingress[0].ip }}"
