---
# teardown_platform.yml
# Démantèlement de la plateforme Kubernetes (ordre inverse du déploiement)
#
# Usage :
#   ansible-playbook -i inventories/homelab.ini teardown_platform.yml
#   ansible-playbook -i inventories/homelab.ini teardown_platform.yml --tags argocd

- name: Fetch kubeconfig from k3s node
  hosts: k3s_nodes
  gather_facts: false
  become: true

  tasks:
    - name: Fetch k3s kubeconfig
      ansible.builtin.fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: /tmp/k3s-homelab.yaml
        flat: yes

    - name: Replace 127.0.0.1 with actual node IP in kubeconfig
      ansible.builtin.replace:
        path: /tmp/k3s-homelab.yaml
        regexp: 'https://127\.0\.0\.1:6443'
        replace: "https://{{ ansible_host }}:6443"
      delegate_to: localhost

- name: Teardown platform components
  hosts: k3s_nodes
  gather_facts: false
  connection: local

  module_defaults:
    group/kubernetes.core.k8s:
      kubeconfig: /tmp/k3s-homelab.yaml
    group/kubernetes.core.helm:
      kubeconfig: /tmp/k3s-homelab.yaml

  tasks:
    - name: Teardown monitoring
      ansible.builtin.include_role:
        name: k8s/monitoring
        tasks_from: teardown
      when: monitoring.enabled | default(false)
      tags: monitoring

    - name: Teardown kube-dashboard
      ansible.builtin.include_role:
        name: k8s/kube_dashboard
        tasks_from: teardown
      when: kube_dashboard.enabled | default(false)
      tags: kube_dashboard

    - name: Teardown argocd
      ansible.builtin.include_role:
        name: k8s/argocd
        tasks_from: teardown
      when: argocd.enabled | default(false)
      tags: argocd

    - name: Teardown cert-manager
      ansible.builtin.include_role:
        name: k8s/cert_manager
        tasks_from: teardown
      when: cert_manager.enabled | default(false)
      tags: cert_manager

    - name: Teardown traefik
      ansible.builtin.include_role:
        name: k8s/traefik
        tasks_from: teardown
      when: traefik.enabled | default(false)
      tags: traefik

    - name: Teardown metallb
      ansible.builtin.include_role:
        name: k8s/metallb
        tasks_from: teardown
      when: metallb.enabled | default(false)
      tags: metallb
