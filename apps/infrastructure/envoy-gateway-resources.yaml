apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway-resources
  namespace: argocd
  annotations:
    # Wave 3 : GatewayClass + Gateway + Certificate
    # Nécessite envoy-gateway (wave 1) ET cert-manager-issuers (wave 2)
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/nSakkriou/homelab-plateform
    targetRevision: main
    path: apps/k8s/envoy-gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: gateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true  # GatewayClass/Gateway validés par le webhook Envoy — pas encore dispo en dry-run
