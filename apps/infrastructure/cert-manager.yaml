apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.17.1
    helm:
      values: |
        crds:
          enabled: true
        # Activer le support expérimental Gateway API pour les solveurs ACME HTTP-01
        featureGates: "ExperimentalGatewayAPISupport=true"
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true  # Nécessaire pour mettre à jour les CRDs cert-manager sans erreurs de taille
      - SkipDryRunOnMissingResource=true  # Évite les échecs si les CRDs ne sont pas encore connues d'ArgoCD
